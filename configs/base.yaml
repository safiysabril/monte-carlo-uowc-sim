# Base configuration: shared defaults. Experiments/campaigns override these keys.
seed: 20260607
rng:
  bit_generator: PCG64
  reference_mode: true          # single-thread, bitwise-reproducible reference

source:
  wavelength_nm: 520            # blue-green
  divergence_rad: 0.01

geometry: vertical              # see configs/geometries.yaml
water_type: clear_ocean        # see configs/water_types.yaml

photons:
  # PyYAML's SafeLoader only recognizes a float exponent with an explicit sign
  # (1.0e+4, not 1.0e4) - the unsigned form silently parses as a *string*, not a
  # number. Written with the sign here for exactly that reason.
  ladder: [1.0e+4, 1.0e+5, 1.0e+6, 1.0e+7]   # convergence study
  production: 1.0e+7

transport:
  algorithm: woodcock
  estimator: next_event        # analog | next_event | forced
  max_scatter_events: 1000

output:
  root: data
  format: parquet
  partition_by: [scenario, water_type, geometry, range_m, seed]
